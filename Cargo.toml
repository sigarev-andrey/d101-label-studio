[package]
name = "niimbot-d101"
version = "0.1.0"
edition = "2024"
description = "Niimbot D101 Bluetooth label studio and local Windows IPP bridge"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
btleplug = "0.11"
csv = "1"
futures = "0.3"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
uuid = "1"
windows-reactor = "=0.100.0"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging", "Win32_Networking_WinHttp"] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "niimbot-d101"
path = "src/main.rs"
